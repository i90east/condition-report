<script>
/* ? ? Clear Checkbox Selections and Textboxes on Page Load ? ? */    
    function clearInputs() {
      // Clear checkboxes
      var checkboxes = document.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(function (checkbox) {
        checkbox.checked = false;
      });

      // Clear textboxes
      var textboxes = document.querySelectorAll('input[type="text"]');
      textboxes.forEach(function (textbox) {
        textbox.value = '';
      });

      // Clear textareas
      var textareas = document.querySelectorAll('textarea');
      textareas.forEach(function (textarea) {
        textarea.value = '';
      });
    }

    // Event listener to call the clearInputs function when the page loads
    window.addEventListener('load', clearInputs);
/* ? ? Condition Report ? ? */
function printElementWithInputs(elementId) {
  // Clone the desired element
  var elementToPrint = document.getElementById(elementId).cloneNode(true);

  // Iterate through checkboxes and textboxes and update their values in the clone
  elementToPrint.querySelectorAll('input[type="checkbox"], input[type="text"]').forEach(function(input) {
    var originalInput = document.getElementById(input.id);
    if (originalInput) {
      if (input.type === 'checkbox') {
        input.checked = originalInput.checked;
      } else if (input.type === 'text') {
        input.value = originalInput.value;
      }
    }
  });

  // Create a new window
  var printWindow = window.open('', '_blank');

  // Append the cloned element to the new window
  printWindow.document.body.appendChild(elementToPrint);

  // Create a style element
  var styleElement = printWindow.document.createElement('style');

  // Set the CSS rules
  var cssRules = `
    body { font-family: 'Verdana', sans-serif; font-size: 14px; }
    .prewrap { white-space: pre-wrap }
    .condchecks { margin:-7px 0px -7px 0px; }
    .condhead { margin-left: 44px; }
    .textarea-border { font-family: 'Verdana', sans-serif; border: 1px solid #000000; font-size: 14px; }
    input[type=checkbox] {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      padding: 4px 5px 4px 2px;
      margin: 4px 0px -2px 2px;
      box-sizing: border-box;
      border: 3px solid #000000;
      border-radius: 30%;
    }
    input[type=checkbox]:checked {
      border-radius: 30%;
      box-shadow: inset 0 6px 6px 10px black;
    }
  `;

  // Append the CSS rules to the style element
  styleElement.appendChild(printWindow.document.createTextNode(cssRules));

  // Append the style element to the document's head
  printWindow.document.head.appendChild(styleElement);

  var img = new Image();
  img.src = 'Condition Report Logo.png';

  img.onload = function() {
    // The image has loaded, now you can trigger the printing
    setTimeout(function() {
      printWindow.print();
      printWindow.close(); // Close the print window
      location.reload(); // Refresh the original page
    }, 500); // Adjust the delay (in milliseconds) as needed
  };

  img.onerror = function() {
    // Handle the case when the image fails to load
    console.error('Error loading the image');
  };
}

    function checkTextarea(textarea) {
        var maxLength = 59;
        var maxRows = 1;

        // Check and limit the character length
        if (textarea.value.length > maxLength) {
            textarea.value = textarea.value.substring(0, maxLength);
        }

        // Check and limit the number of rows
        var lineCount = textarea.value.split("\n").length;
        if (lineCount > maxRows) {
            var lines = textarea.value.split("\n").slice(0, maxRows);
            textarea.value = lines.join("\n");
        }
    }

            // Function to handle Enter key press
        function handleKeyPress(event) {
            if (event.keyCode === 13) { // Check if Enter key is pressed
                document.getElementById('enter').click(); // Trigger the button click
            }
        }

        // Add event listener for key press on the document
        document.addEventListener('keypress', handleKeyPress);
</script>
